[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roman-lolo"
version = "0.1.0"
description = "Roman WFI CRNL simulation and lamp-on/lamp-off analysis tools"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Maxime Rizzo", email = "m.rizzo@astro.example.com"}
]
license = {text = "MIT"}
keywords = ["astronomy", "roman", "wfi", "crnl", "photometry"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=1.20",
    "astropy>=5.0",
    "matplotlib>=3.3",
    "photutils>=1.5",
    "scipy>=1.7",
    "pyds9>=1.8.1",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0",
    "pytest>=6.0",
    "black>=22.0",
    "flake8>=4.0",
]

[project.urls]
Homepage = "https://github.com/example/roman-lolo"
Documentation = "https://github.com/example/roman-lolo#readme"
Repository = "https://github.com/example/roman-lolo.git"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages]
find = {where = ["src"]}
